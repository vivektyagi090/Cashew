<div class="min-h-screen relative flex items-center justify-center overflow-hidden font-sans bg-black">
  
  <!-- NUCLEAR TRANSPARENCY OVERRIDE -->
  <style>
    #vvk-global-header {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }
  </style>

  <!-- BACKGROUND MASTERPIECE -->
  <div class="fixed inset-0 z-[-1] bg-black">
    <!-- The Cinematic Backdrop -->
    <!-- Fixed Path: Serving directly from public at the root -->
    <img src="/images/login-brand.png" 
         alt="Obsidian Harvest" 
         class="w-full h-full object-cover scale-[2.4] animate-float opacity-80"
         style="filter: brightness(0.5) contrast(1.1); position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;">
    
    <!-- Deep Vignette for focus -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,1)_100%)]"></div>
  </div>

  <!-- PARTICLE ATMOSPHERE (Gold Dust) -->
  <div class="absolute inset-0 z-10 pointer-events-none opacity-40">
    <div class="dust-particle p1"></div>
    <div class="dust-particle p2"></div>
    <div class="dust-particle p3"></div>
    <div class="dust-particle p4"></div>
    <div class="dust-particle p5"></div>
  </div>

  <!-- THE FLOATING PODIUM -->
  <div class="relative z-20 w-full max-w-[520px] mx-4 pt-24 pb-12">
    
    <!-- Branding Header (Luxury Stack) -->
    <div class="text-center mb-10 reveal-element in-view" style="transition-delay: 100ms;">
      <div class="flex flex-col items-center gap-4 mb-6">
        <div class="w-16 h-16 bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 flex items-center justify-center shadow-2xl group transition-all duration-700 hover:border-accent-honey/50">
          <svg class="w-8 h-8 text-accent-honey group-hover:scale-110 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-black uppercase tracking-[0.5em] text-accent-honey drop-shadow-sm">Obsidian Protocol</span>
          <h1 class="text-5xl md:text-6xl font-serif font-black text-white tracking-tighter mt-2">Access Portal</h1>
        </div>
      </div>
    </div>

    <!-- The Registry Pod (Enhanced Glassmorphism) -->
    <div class="relative group bg-white/[0.04] backdrop-blur-[60px] border border-white/10 rounded-[3.5rem] p-10 md:p-14 shadow-[0_40px_120px_rgba(0,0,0,0.6)] reveal-element in-view overflow-hidden transition-all duration-700 hover:border-white/20" 
         style="transition-delay: 200ms;">
      
      <!-- HUD Scanning Line (Enhanced) -->
      <div class="hud-scanner"></div>

      <!-- Atmospheric Glow -->
      <div class="absolute -top-32 -right-32 w-80 h-80 bg-accent-honey/10 rounded-full blur-[100px] pointer-events-none animate-pulse-soft"></div>
      <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-accent-tan/5 rounded-full blur-[100px] pointer-events-none"></div>

      <div class="space-y-10 relative z-10">
        
        <!-- Registry Input: Email (The Identity Protocol) -->
        <div class="space-y-4">
          <div class="flex justify-between items-center px-4">
            <label class="text-[9px] font-black uppercase tracking-[0.5em] text-accent-honey/70">Identity Protocol</label>
            <span class="text-[8px] font-black text-white/20 uppercase tracking-widest">v.2.6.0</span>
          </div>
          <div class="relative group/input">
            <div class="absolute inset-x-0 bottom-0 h-[1px] bg-gradient-to-r from-transparent via-accent-honey/0 to-transparent group-focus-within/input:via-accent-honey/50 transition-all duration-700"></div>
            <input
              type="email"
              [(ngModel)]="email"
              placeholder="operator@vvk.protocol"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-7 py-5 text-white font-medium outline-none focus:border-white/20 focus:bg-white/[0.08] transition-all placeholder:text-white/10"
              (keyup.enter)="login()"
            />
            <svg class="absolute right-7 top-1/2 -translate-y-1/2 w-4 h-4 text-white/10 group-focus-within/input:text-accent-honey transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        </div>

        <!-- Registry Input: Password (The Authentication Key) -->
        <div class="space-y-4">
          <div class="flex justify-between items-center px-4">
            <label class="text-[9px] font-black uppercase tracking-[0.5em] text-accent-honey/70">Authentication Key</label>
            <a href="#" class="text-[8px] font-black text-accent-tan uppercase tracking-widest hover:text-white transition-colors">Emergency Reset</a>
          </div>
          <div class="relative group/input">
            <div class="absolute inset-x-0 bottom-0 h-[1px] bg-gradient-to-r from-transparent via-accent-honey/0 to-transparent group-focus-within/input:via-accent-honey/50 transition-all duration-700"></div>
            <input
              type="password"
              [(ngModel)]="password"
              placeholder="••••••••••••"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-7 py-5 text-white font-medium outline-none focus:border-white/20 focus:bg-white/[0.08] transition-all placeholder:text-white/10"
              (keyup.enter)="login()"
            />
            <svg class="absolute right-7 top-1/2 -translate-y-1/2 w-4 h-4 text-white/10 group-focus-within/input:text-accent-honey transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
        </div>

        <!-- ERROR FEEDBACK (HUD Styled) -->
        <div class="p-5 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 text-[10px] font-black tracking-[0.2em] uppercase animate-in fade-in slide-in-from-top-2 flex items-center justify-center gap-4 text-center" *ngIf="error()">
          <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span>
          {{ error() }}
        </div>

        <!-- ESTABLISH LINK BUTTON (Liquid Fill Style) -->
        <button 
          (click)="login()" 
          [disabled]="loading()"
          class="w-full relative py-6 rounded-2xl bg-accent-honey text-primary-green font-black text-[12px] uppercase tracking-[0.5em] shadow-[0_20px_60px_rgba(244,162,97,0.4)] transition-all duration-500 hover:bg-white hover:-translate-y-1.5 hover:shadow-[0_30px_70px_rgba(255,255,255,0.25)] disabled:opacity-20 disabled:translate-y-0 disabled:shadow-none active:scale-95 group overflow-hidden">
          
          <!-- Liquid Fill Interior -->
          <div class="absolute inset-0 bg-primary-green/5 -translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out"></div>

          <span *ngIf="!loading()" class="relative z-10 flex items-center justify-center gap-4">
            Initialize Access <span class="group-hover:translate-x-2 transition-transform duration-500">→</span>
          </span>
          <span *ngIf="loading()" class="relative z-10 flex items-center justify-center gap-5">
            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Validating...
          </span>
        </button>

      </div>
    </div>

    <!-- Digital Signature Footer -->
    <div class="mt-16 flex flex-col items-center gap-6 opacity-40 reveal-element in-view" style="transition-delay: 400ms;">
        <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-white to-transparent"></div>
        <p class="text-[9px] font-black text-white uppercase tracking-[0.6em] font-serif italic text-center">VVKBMS Artisanal Infrastructure <br/> Secure Node 0x92f</p>
    </div>

  </div>

  <!-- STYLES FOR HUD & PARTICLES -->
  <style>
    @keyframes hud-scan-master {
      0% { top: -20%; opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { top: 120%; opacity: 0; }
    }
    .hud-scanner {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--color-accent-honey), transparent);
      z-index: 5;
      pointer-events: none;
      animation: hud-scan-master 5s ease-in-out infinite;
      box-shadow: 0 0 20px var(--color-accent-honey);
    }
    @keyframes particle-drift {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translate(200px, -200px) rotate(360deg) scale(1.5); opacity: 0; }
    }
    .dust-particle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--color-accent-honey);
      border-radius: 50%;
      filter: blur(2px) brightness(1.2);
      box-shadow: 0 0 10px var(--color-accent-honey);
    }
    .p1 { top: 80%; left: 10%; animation: particle-drift 20s infinite; }
    .p2 { top: 30%; left: 90%; animation: particle-drift 25s infinite 4s; }
    .p3 { top: 15%; left: 20%; animation: particle-drift 22s infinite 8s; }
    .p4 { top: 50%; left: 50%; animation: particle-drift 30s infinite 2s; }
    .p5 { top: 85%; left: 75%; animation: particle-drift 28s infinite 12s; }
  </style>
</div>
