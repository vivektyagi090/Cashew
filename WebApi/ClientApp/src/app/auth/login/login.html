<div class="min-h-screen relative flex items-center justify-center overflow-hidden font-sans bg-primary-green">
  
  <!-- PREMIUM E-COMMERCE OVERRIDE -->
  <style>
    #vvk-global-header {
      background: rgba(27, 67, 50, 0.4) !important;
      backdrop-filter: blur(20px) !important;
      border-color: rgba(255, 255, 255, 0.05) !important;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

  <!-- BACKGROUND MASTERPIECE -->
  <div class="fixed inset-0 z-[-1]">
    <!-- Lifestyle Image -->
    <img src="https://images.unsplash.com/photo-1604084849174-7b97a71cbbf3?w=1600" 
         alt="Golden Harvest" 
         class="w-full h-full object-cover opacity-30 scale-105 animate-pulse-soft">
    
    <!-- Warm Gradients -->
    <div class="absolute inset-0 bg-gradient-to-b from-primary-green/90 via-primary-green/60 to-primary-green/95"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(244,162,97,0.15)_0%,transparent_50%)]"></div>
  </div>

  <!-- THE AUTH PODIUM -->
  <div class="relative z-20 w-full max-w-[480px] mx-4 py-20 flex flex-col items-center">
    
    <!-- Brand Mark -->
    <a routerLink="/" class="flex flex-col items-center gap-4 mb-12 group transition-transform duration-700 hover:scale-105">
      <div class="h-20 overflow-hidden rounded-2xl transition-all duration-500">
        <img src="/assets/images/logo-b.png" alt="VVKBMS" class="h-full object-contain">
      </div>
      <div class="text-center">
        <span class="text-xs font-black text-accent-honey uppercase tracking-[0.4em]">Konkan Gold Selection</span>
        <h1 class="text-4xl font-serif font-black text-white tracking-tight mt-1">VVKBMS Portal</h1>
      </div>
    </a>

    <!-- The Auth Card -->
    <div class="w-full auth-card rounded-[3rem] p-8 md:p-12 shadow-2xl relative overflow-hidden transition-all duration-700">
      
      <!-- Subtle Decorative Cashew -->
      <img src="/assets/images/cashew-01.png" 
           class="absolute -right-12 -bottom-12 w-40 h-40 opacity-5 rotate-[30deg] pointer-events-none group-hover:scale-110 transition-transform duration-1000">

      <div class="space-y-8 relative z-10">
        
        <!-- Social Entry -->
        <div class="space-y-4">
          <button (click)="googleLogin()" 
                  class="w-full flex items-center justify-center gap-4 py-4 rounded-2xl bg-white text-primary-green font-black text-xs uppercase tracking-widest hover:bg-accent-honey transition-all shadow-xl active:scale-95 group/social">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="flex items-center gap-4">
          <div class="h-px flex-1 bg-white/10"></div>
          <span class="text-[9px] font-black text-white/20 uppercase tracking-widest">or sign in with</span>
          <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <!-- Mode Toggle -->
        <div class="flex p-1.5 rounded-2xl bg-black/20 border border-white/5">
          <button (click)="setLoginMode('email')" 
                  [class]="loginMode === 'email' ? 'bg-white text-primary-green shadow-xl' : 'text-white/40 hover:text-white'"
                  class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
            Email
          </button>
          <button (click)="setLoginMode('mobile')" 
                  [class]="loginMode === 'mobile' ? 'bg-white text-primary-green shadow-xl' : 'text-white/40 hover:text-white'"
                  class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
            Mobile
          </button>
        </div>

        <!-- Identity Field -->
        <div class="space-y-3">
          <label class="text-[10px] font-black uppercase tracking-widest text-white/40 px-2">
            {{ loginMode === 'email' ? 'Email Address' : 'Phone Number' }}
          </label>
          <div class="relative group/input">
            <input *ngIf="loginMode === 'email'"
              type="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white text-sm outline-none focus:border-accent-honey/50 focus:bg-white/10 transition-all placeholder:text-white/10"
              (keyup.enter)="login()"
            />
            <input *ngIf="loginMode === 'mobile'"
              type="tel"
              [(ngModel)]="mobileNumber"
              placeholder="+91 ••••• •••••"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white text-sm outline-none focus:border-accent-honey/50 focus:bg-white/10 transition-all placeholder:text-white/10 tracking-widest"
              (keyup.enter)="login()"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-3">
          <div class="flex justify-between items-center px-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-white/40">Password</label>
            <a href="#" class="text-[9px] font-black text-accent-tan hover:text-white transition-colors">Forgot?</a>
          </div>
          <div class="relative group/input">
            <input
              type="password"
              [(ngModel)]="password"
              placeholder="••••••••••••"
              class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white text-sm outline-none focus:border-accent-honey/50 focus:bg-white/10 transition-all placeholder:text-white/10"
              (keyup.enter)="login()"
            />
          </div>
        </div>

        <!-- Error State -->
        <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-[10px] font-bold uppercase tracking-widest text-center animate-in fade-in slide-in-from-top-1" *ngIf="error()">
          {{ error() }}
        </div>

        <!-- Submit Button -->
        <button 
          (click)="login()" 
          [disabled]="loading()"
          class="w-full relative py-5 rounded-2xl bg-accent-honey text-primary-green font-black text-sm uppercase tracking-[0.2em] shadow-2xl shadow-accent-honey/20 transition-all duration-500 hover:scale-[1.02] hover:bg-white active:scale-95 disabled:opacity-20 group overflow-hidden">
          
          <span *ngIf="!loading()" class="relative z-10 flex items-center justify-center gap-3">
            Sign In to Store <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </span>
          <span *ngIf="loading()" class="relative z-10 flex items-center justify-center gap-3">
            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing In...
          </span>
        </button>

        <!-- Footer Link -->
        <div class="text-center pt-2">
          <span class="text-white/30 text-[10px] font-bold uppercase tracking-widest">New to VVKBMS?</span>
          <a routerLink="/register" class="text-white text-[10px] font-black uppercase tracking-widest hover:text-accent-honey transition-colors ml-2">Create Account</a>
        </div>

      </div>
    </div>

    <!-- Legal Footer -->
    <div class="mt-12 text-center opacity-30">
      <p class="text-[9px] font-black text-white uppercase tracking-[0.4em]">Handcrafted with love from Konkan <br/> © 2026 VVKBMS Premium Harvest</p>
    </div>

  </div>
</div>
