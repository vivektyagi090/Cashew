<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
          <span class="text-[9px] font-black text-solar-gold uppercase tracking-[0.3em] mb-1 block">Live Flow</span>
          <h2 class="text-2xl font-sans font-black text-white tracking-tight">Recent Activity</h2>
        </div>
        <a href="#" class="px-4 py-2 rounded-xl bg-white/5 text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-solar-gold hover:bg-white/10 transition-all border border-white/5">View History</a>
    </div>

    <div class="rich-card !p-0 overflow-hidden">
        <div class="divide-y divide-white/5">
            @for (activity of activities; track activity.text) {
            <div class="flex gap-4 p-6 hover:bg-white/[0.02] transition-colors group">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border border-white/5 shadow-inner" 
                     [ngClass]="{
                        'bg-green-500/10 text-green-500': activity.type === 'create',
                        'bg-blue-500/10 text-blue-500': activity.type === 'edit',
                        'bg-purple-500/10 text-purple-500': activity.type === 'user',
                        'bg-red-500/10 text-red-500': activity.type === 'delete'
                     }">
                    @switch (activity.type) {
                        @case ('create') {
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                        }
                        @case ('edit') {
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        }
                        @case ('user') {
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        }
                        @case ('delete') {
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        }
                    }
                </div>
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-300 group-hover:text-white transition-colors" [innerHTML]="activity.text"></p>
                    <div class="flex items-center gap-2 mt-2">
                      <div class="w-1 h-1 rounded-full bg-slate-600"></div>
                      <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest">{{ activity.time }}</p>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</div>
