<div class="rich-card group flex items-center gap-6">
    <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center text-slate-500 group-hover:text-solar-gold transition-colors duration-500 shadow-inner">
        @switch (icon) {
            @case ('content') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13.5V4a2 2 0 0 1 2-2h8.5L20 7.5V20a2 2 0 0 1-2 2h-5.5"/><polyline points="14 2 14 8 20 8"/><path d="M10.42 12.64a2.1 2.1 0 1 0-2.97 2.97L11 19l3.55-3.39a2.1 2.1 0 1 0-2.97-2.97Z"/></svg>
            }
            @case ('users') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            }
            @case ('views') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
            }
            @case ('engagement') {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7h8m0 0v8m0-8-8 8-4-4-6 6"/></svg>
            }
        }
    </div>
    <div class="flex-1">
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 mb-1">{{ label }}</p>
        <div class="flex items-baseline gap-3">
            <p class="text-3xl font-sans font-black text-white tracking-tighter">{{ value }}</p>
            <span class="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded-lg border" 
                  [ngClass]="isPositive ? 'text-green-500 border-green-500/20 bg-green-500/5' : 'text-red-500 border-red-500/20 bg-red-500/5'">
                {{ change }}
            </span>
        </div>
    </div>
</div>
